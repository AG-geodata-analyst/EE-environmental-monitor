name: Daily Environmental Forecast Pipeline

on:
  schedule:
    # 06:17 UTC — off-peak minute (GitHub skips :00 under high load)
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: env_monitor
          POSTGRES_PASSWORD: env_monitor_pw
          POSTGRES_DB: env_monitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      AIRFLOW_HOME: ${{ github.workspace }}/airflow_home
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////tmp/airflow.db
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "apache-airflow==3.1.3" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.1.3/constraints-3.12.txt"
          pip install requests pandas pydantic psycopg2-binary apache-airflow-providers-postgres

      - name: Apply schema
        env:
          PGPASSWORD: env_monitor_pw
        run: psql -h localhost -U env_monitor -d env_monitor -f sql/schema.sql

      - name: Initialize Airflow
        run: |
          mkdir -p $AIRFLOW_HOME
          airflow db migrate

      - name: Register connection
        run: |
          airflow connections add postgres_env_monitor \
            --conn-type postgres --conn-host localhost \
            --conn-schema env_monitor --conn-login env_monitor \
            --conn-password env_monitor_pw --conn-port 5432

      - name: Run the DAG
        run: airflow dags test estonia_environmental_monitor $(date -u +%Y-%m-%d)

      - name: Commit updated public data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update forecast data ($(date -u +%Y-%m-%d))"
            git push
          fi
